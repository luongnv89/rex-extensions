name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: JavaScript syntax
        run: for f in $(git ls-files '*.js'); do node --check "$f" || exit 1; done
      # Lua 5.1, the version Rex runs, built by the action and cached
      # between runs, so the job doesn't depend on Ubuntu's package mirrors.
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"
      - name: Lua syntax
        run: for f in $(git ls-files '*.lua'); do luac -p "$f" || exit 1; done
      - name: Tests
        # Every extension folder with a test/ folder runs its own tests.
        run: |
          for d in */; do
            [ -d "$d/test" ] || continue
            echo "== $d"
            (cd "$d" && node --test) || exit 1
          done
