# Publishes landing-page/ (the extensions slideshow and its Docs, Changelog and Privacy pages) to GitHub Pages,
# at https://luongnv89.github.io/rex-extensions/ unless a custom domain is set in the repository's Pages settings.
# Pages must use "GitHub Actions" as its source (Settings → Pages → Build and deployment).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "landing-page/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: landing-page
      - id: deployment
        uses: actions/deploy-pages@v5
